[project]
name = "sspoc"
version = "0.1.0"
description = "Sparse Sensor Placement Optimization for Classification"
readme = "README.md"
authors = [
    { name = "Ankur Kumar", email = "ank@leoank.me" },
    { name = "Bing Brunton", email = "bing.brunton@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.21.0",
  "scipy>=1.7.0",
  "cvxpy>=1.3.0",
  "matplotlib"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
