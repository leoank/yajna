[package]
name = "yajna-serve"
version = "0.1.0"
edition = "2021"
description = "The server behind `yajna serve`: the rendered site, and later the live files viewer (ADR-0027)"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
globset = "0.4"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
