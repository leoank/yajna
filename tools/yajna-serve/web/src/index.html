<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>notebook</title>
<script>
  // The app is served under any prefix (/, /w/<branch>/, /n/<namespace>/, a relay's path):
  // its base is the address up to the first of its own routes, set before anything loads
  // so every relative URL below and in the app resolves against it (ADR-0041).
  (function () {
    var p = location.pathname;
    var m = p.match(/^(.*?)\/(p|c|log|tasks|reviews|changes|files)(\/.*)?$/);
    var base = m ? m[1] : p.replace(/\/[^/]*$/, '');
    window.__YAJNA_BASE__ = base;
    document.write('<base href="' + base.replace(/"/g, '%22') + '/">');
  })();
</script>
