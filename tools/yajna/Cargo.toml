[package]
name = "yajna"
version = "0.7.1"
edition = "2021"
description = "The yajna lab-notebook command: new, log, result, tasks, ref, validate, index, timeline, tree, site, serve"
license = "MIT"
default-run = "yajna"

[[bin]]
name = "yajna"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
fastrand = "2"
inquire = "0.9"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
libc = "0.2"
jsonschema = { version = "0.59", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
sha2 = "0.10"
shlex = "1"
toml = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
yajna-serve = { path = "../yajna-serve" }

[dev-dependencies]
tempfile = "3"
