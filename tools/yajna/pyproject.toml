[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yajna"
version = "0.1.0"
description = "CLI for the yajna lab notebook: create pages, log, record results, list tasks, validate"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4", "prompt_toolkit>=3"]

[project.scripts]
yajna = "yajna.cli:main"

[tool.setuptools.packages.find]
include = ["yajna*"]
