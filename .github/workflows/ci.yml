# Every push and pull request: the flake's checks (the CLI's tests in the sandbox, the
# Neovim plugin's headless tests) and the package build, through Nix; and a Windows build.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: nix flake check -L
      - run: nix build -L .#yajna
  # the release's Windows binaries: the tests are Unix-only (symlinks, permissions), so each
  # is built here and makes a notebook that it must validate, before a tag needs it
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --manifest-path tools/Cargo.toml -p yajna
      - run: tools/target/debug/yajna.exe --version
      - run: cargo build --locked --release --manifest-path tools/Cargo.toml -p yajna
      - name: a notebook made and validated by the release binary
        shell: bash
        run: |
          y=$PWD/tools/target/release/yajna.exe
          export XDG_STATE_HOME="$RUNNER_TEMP/state"
          # init registers the notebook before it is in git; later commands find it through
          # git, which prints C:/… where the root is C:\…: the same notebook, no note
          $y init lab "$RUNNER_TEMP/lab" --author ci
          cd "$RUNNER_TEMP/lab"
          git init -q
          {
            $y new project "Toy" --author ci
            $y new experiment "Q" --project PRJ-0001 --author ci
            $y log "a line" --author ci
            $y validate
          } 2>&1 | tee out.txt
          if grep "is also at" out.txt; then echo "registered twice"; exit 1; fi
          if grep -rl $'\r' notes; then echo "pages written with CRLF"; exit 1; fi
