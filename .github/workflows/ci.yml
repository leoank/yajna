# Every push and pull request: the flake's checks (the CLI's tests in the sandbox, the
# Neovim plugin's headless tests) and the package build, through Nix; and a Windows build.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: nix flake check -L
      - run: nix build -L .#yajna
  # the release's Windows binary: the tests are Unix-only (symlinks, permissions), so it is
  # built, and run once, here before a tag needs it
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --manifest-path tools/Cargo.toml -p yajna
      - run: tools/target/debug/yajna.exe --version
      - run: cargo build --locked --release --manifest-path tools/Cargo.toml -p yajna
      - run: tools/target/release/yajna.exe --version
