[project]
name = "yajna"
version = "0.1.0"
description = "Yajna"
readme = "README.md"
authors = [
    { name = "Ankur Kumar", email = "ank@leoank.me" }
]
requires-python = ">=3.11"
dependencies = [
  "polars",
  "litellm",
  "langchain",
  "langchain-litellm",
  "langchain-ollama",
  "langchain-community",
  "langgraph",
  "scipy>=1.16.0",
  "matplotlib>=3.10.3",
]

[project.optional-dependencies]
cpu = [
  "torch",
  "torchvision",
]
cu124 = [
  "torch",
  "torchvision",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu124" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project.scripts]
yajna = "yajna.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.jupytext.formats]
"notebooks/ipynb" = "ipynb"
"notebooks/pypct" = "py:percent"